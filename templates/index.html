<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compact Storage Visualizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f3f4f6; }
        .bin-rect { transition: all 0.3s ease; }
        .robot-marker { transition: all 0.5s ease; }
        .grid-container { overflow: auto; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #888; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">
    <!-- Header -->
    <header class="bg-slate-800 text-white px-4 py-2 shadow-sm flex justify-between items-center">
        <h1 class="text-base font-bold flex items-center gap-2">
            <i class="fas fa-warehouse"></i>
            Compact Storage Simulation
        </h1>
        <div class="text-xs text-slate-300 font-mono" id="history-counter">
            0/0
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex overflow-hidden min-h-0">
        <!-- Sidebar -->
        <aside class="w-56 bg-white shadow border-r border-gray-200 overflow-y-auto p-3 flex flex-col gap-3 text-sm">
            <section>
                <h2 class="text-[10px] font-bold text-gray-500 uppercase tracking-wider mb-1">Zeit</h2>
                <div class="text-xl font-mono font-bold text-slate-700" id="current-time">t=0</div>
            </section>

            <section>
                <h2 class="text-[10px] font-bold text-gray-500 uppercase tracking-wider mb-1">Event</h2>
                <div id="event-card" class="bg-slate-50 border border-slate-200 rounded p-2">
                    <div id="event-type" class="font-bold text-slate-800 text-xs">-</div>
                    <div id="event-details" class="text-[10px] text-slate-500 mt-1 leading-snug">Kein Event aktiv</div>
                </div>
            </section>

            <section>
                <h2 class="text-[10px] font-bold text-gray-500 uppercase tracking-wider mb-1">Pickstation</h2>
                <div id="pickstation-list" class="flex flex-wrap gap-1">
                    <span class="text-gray-400 italic text-xs">Leer</span>
                </div>
            </section>

            <section>
                <h2 class="text-[10px] font-bold text-gray-500 uppercase tracking-wider mb-1">Active Queue</h2>
                <div id="active-queue-card" class="bg-slate-50 border border-slate-200 rounded p-2 text-[10px] text-slate-700 leading-snug">
                    Keine pending Requests
                </div>
            </section>

            <section class="flex-1 min-h-0">
                <h2 class="text-[10px] font-bold text-gray-500 uppercase tracking-wider mb-1">Roboter</h2>
                <div id="robot-list" class="flex flex-col gap-1">
                    <!-- Robots will be injected here -->
                </div>
            </section>
        </aside>

        <!-- Visualization Area -->
        <section class="flex-1 flex flex-col bg-gray-100 relative min-w-0 min-h-0">
            <div id="viz-container" class="flex-1 grid-container p-2 overflow-auto min-h-0">
                <svg id="viz-svg"></svg>
            </div>

            <!-- Controls -->
            <div class="bg-white border-t border-gray-200 px-3 py-2 flex justify-center items-center gap-2 shadow-inner">
                <button id="btn-reset" class="p-1.5 text-gray-500 hover:text-slate-800 transition-colors" title="Reset">
                    <i class="fas fa-undo text-sm"></i>
                </button>
                <button id="btn-prev" class="px-4 py-1.5 bg-slate-200 hover:bg-slate-300 rounded font-bold text-slate-700 transition-all flex items-center gap-1 text-xs">
                    <i class="fas fa-step-backward"></i> Previous
                </button>
                <button id="btn-play" class="p-2.5 bg-teal-500 hover:bg-teal-600 text-white rounded-full shadow transform active:scale-95 transition-all flex items-center justify-center w-9 h-9">
                    <i class="fas fa-play text-xs" id="play-icon"></i>
                </button>
                <button id="btn-next" class="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded font-bold shadow transform active:scale-95 transition-all flex items-center gap-1 text-xs">
                    <i class="fas fa-step-forward"></i> Next
                </button>
            </div>
        </section>
    </main>

    <script src="/static/js/visualizer.js"></script>
</body>
</html>
